[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashvalidatorplus"
version = "0.3.0"
description = "PyQt5-based file hash validator with multiple algorithm support"
readme = "docs/README.md"
requires-python = ">=3.6"
authors = [{name = "HashValidatorPlus Contributors"}]
license = {text = "MIT"}
keywords = ["hash", "validator", "file", "checksum", "sha256", "md5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Utilities"
]
dependencies = ["PyQt5>=5.15.0"]

[project.scripts]
hashvalidatorplus = "src.app:main"

[tool.setuptools]
packages = ["src"]
