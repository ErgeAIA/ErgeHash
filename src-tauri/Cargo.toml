[package]
name = "erge-hash"
version = "0.3.0"
description = "二哥的文件哈希检验工具"
authors = ["B站🔥宝藏二哥AIA"]
edition = "2021"

[package.metadata.tauri]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "erge_hash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "6"
csv = "1"
tokio = { version = "1", features = ["sync", "parking_lot"] }
thiserror = "2"

# [ERGE-DEBUG] 曾本地 vendor wry 用于 OLE 拖放调试（见 docs/.AI/debug-log.md BUG-005 系列）。
# 2026-08-14 晚：AIVault（同栈 registry wry 0.55.1 原版）实测拖拽正常，确认 vendor 改动
# 破坏了原版"枚举 WebView2 子窗口注册 IDropTarget"机制，故移除 patch 回归上游原版。
# vendor/ 目录保留但不再参与构建；如回退可恢复下方 patch。
# [patch.crates-io]
# wry = { path = "vendor/wry" }
