[package]
name = "erge-hash"
version = "0.3.0"
description = "二哥的文件哈希检验工具"
authors = ["B站🔥宝藏二哥AIA"]
edition = "2021"

[package.metadata.tauri]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# tauri dev 默认使用 debug 构建（opt-level=0），而 sha2/sha1/md-5 等纯 Rust 加密库
# 在无优化时极慢（735MB SHA256 从无优化的 ~12s 降到 opt-level=2 的 ~1.x s）。
# 这里把 dev 构建提升到 opt-level=2，使开发/调试期也能获得可用性能，
# 同时保留调试信息与增量编译。
[profile.dev]
opt-level = 2

[lib]
name = "erge_hash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "6"
csv = "1"
tokio = { version = "1", features = ["sync", "parking_lot"] }
thiserror = "2"

# [ERGE-DEBUG] vendor/wry 调试副本已于 2026-08-15 删除；BUG-005 根因与回退说明见 docs/.AI/debug-log.md。
